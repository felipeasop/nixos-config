# O lookahead preserva "Steam, exceto a janela principal". Confirme o appid e
# título com `mmsg -e` na sessão Mango caso a Steam os altere.
windowrule=isfloating:1,appid:steam,title:^(?![Ss]team$).*
windowrule=isfloating:1,isopensilent:1,appid:steam,title:^notificationtoasts_\d+_desktop$

# PLACEHOLDER: Mango só posiciona janelas flutuantes por offset percentual a
# partir do centro; não há o equivalente direto de bottom-right (10px, 10px).
# windowrule=offsetx:90,offsety:90,appid:steam,title:^notificationtoasts_\d+_desktop$

# SEM EQUIVALENTE: place-within-backdrop para a layer noctalia-wallpaper.
# Mango tem layerrule para animação/blur/sombra, mas não controla a colocação
# dentro do backdrop.
