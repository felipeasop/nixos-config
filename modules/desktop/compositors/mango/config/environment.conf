# Ambiente de sessão equivalente ao do Niri.
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,kde
env=XDG_MENU_PREFIX,plasma-
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

cursor_theme=breeze_cursors
cursor_size=24

# O módulo NixOS registra a sessão, mas não importa as variáveis do compositor
# para o systemd do usuário. Este helper faz a importação e inicia o Noctalia.
exec-once=mango-session-ready
