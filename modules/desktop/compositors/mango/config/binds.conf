# --- Aplicativos e shell ----------------------------------------------------
# SEM EQUIVALENTE: show-hotkey-overlay do Niri. Mango não fornece overlay de
# atalhos; use um launcher/script externo se desejar.
bind=SUPER,Return,spawn,ghostty
bind=SUPER,D,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER,B,spawn_shell,zen-browser || zen-beta || zen-twilight
bind=SUPER+SHIFT,B,spawn_shell,librewolf -private-window || zen-browser -private-window || zen-beta -private-window || zen-twilight -private-window
bind=SUPER+ALT,L,spawn_shell,noctalia msg session lock
bind=SUPER+SHIFT,Q,spawn_shell,noctalia msg session menu
bind=SUPER,E,spawn,dolphin
bind=SUPER+SHIFT,E,spawn,ghostty -e yazi
bind=SUPER,A,spawn,spotify
bind=SUPER+SHIFT,S,spawn,steam
bind=SUPER,Z,spawn,zeditor
bind=SUPER,X,spawn,ghostty -e btop
bind=SUPER,S,spawn_shell,noctalia msg panel-toggle control-center
bind=SUPER,Comma,spawn_shell,noctalia msg settings-toggle
bind=ALT,Tab,spawn_shell,noctalia msg window-switcher

# O Noctalia é iniciado por mango-session-ready e aceita estes binds mesmo com
# a tela bloqueada (`bindl`), como na configuração Niri.
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn_shell,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn_shell,noctalia msg volume-mute
bindl=NONE,XF86AudioNext,spawn_shell,noctalia msg media-next
bindl=NONE,XF86AudioPrev,spawn_shell,noctalia msg media-previous
bindl=NONE,XF86AudioPlay,spawn_shell,noctalia msg media-play-pause
bindl=NONE,XF86AudioPause,spawn_shell,noctalia msg media-play-pause
bindl=NONE,XF86MonBrightnessUp,spawn_shell,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn_shell,noctalia msg brightness-down

# --- Foco, movimentação e tags ---------------------------------------------
bind=SUPER,Q,killclient
bind=SUPER,H,focusdir,left
bind=SUPER,J,focus_window_or_workspace,down
bind=SUPER,K,focus_window_or_workspace,up
bind=SUPER,L,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focus_window_or_workspace,down
bind=SUPER,Up,focus_window_or_workspace,up
bind=SUPER,Right,focusdir,right

bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right

bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,J,tagtoright
bind=SUPER+CTRL,K,tagtoleft
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,tagtoright
bind=SUPER+CTRL,Up,tagtoleft
bind=SUPER+CTRL,Right,exchange_client,right

# SEM EQUIVALENTE: focus/move-column-first e -last do Niri.

bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+CTRL+SHIFT,Left,tagmon,left,1
bind=SUPER+CTRL+SHIFT,Right,tagmon,right,1
bind=SUPER+CTRL+SHIFT,Up,tagmon,up,1
bind=SUPER+CTRL+SHIFT,Down,tagmon,down,1

axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left

# --- Tags numéricas ---------------------------------------------------------
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

# --- Layout e sessão --------------------------------------------------------
bind=SUPER,R,switch_proportion_preset
# Mango só expõe proporção absoluta e ciclo de presets, não incremento relativo.
bind=SUPER,Minus,set_proportion,0.33333
bind=SUPER,Equal,set_proportion,0.66667
bind=SUPER,T,togglefloating
bind=SUPER+SHIFT,F,togglefullscreen

# SEM EQUIVALENTE: maximize-column, center-column,
# center-visible-columns e set-window-height para janelas tiled.
# `togglemaximizescreen` só maximiza a janela inteira, portanto não foi ligado
# a Mod+F para evitar mudar a semântica do atalho.

# Mango não possui captura nativa. O helper declarativo salva em
# Pictures/Screenshots e também envia a imagem para o clipboard.
bind=NONE,Print,spawn,mango-screenshot region
bind=ALT,Print,spawn,mango-screenshot window
bind=CTRL,Print,spawn,mango-screenshot screen

# SEM EQUIVALENTE: toggle-keyboard-shortcuts-inhibit do Niri.
bind=CTRL+ALT,Delete,quit
bind=SUPER,O,toggleoverview
bind=SUPER,W,toggleoverview

# SEM EQUIVALENTE: os seis binds Mod+Ctrl+Alt+{J,K,Up,Down,Wheel} que usavam
# niri-move-window-to-new-workspace. Mango tem `view_insert` para navegar/criar
# uma tag vazia, mas não move a janela focada para uma nova tag dinâmica.
# bind=SUPER+CTRL+ALT,J,view_insert,next
# bind=SUPER+CTRL+ALT,K,view_insert,prev

# --- Mouse ------------------------------------------------------------------
# Equivalente aos binds padrão de mover/redimensionar janelas flutuantes.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
